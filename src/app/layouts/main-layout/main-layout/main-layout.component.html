<mat-sidenav-container class="sidenav-container">

    <!-- Sidebar -->
    <mat-sidenav
      #sidenav
      class="sidenav"
      [mode]="sidenavMode"
      [opened]="isSidenavOpened"
    >
  
      <div class="sidebar-header">
        <span>EMS</span>
      </div>
  
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" (click)="closeSidenavOnMobile()">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
  
        <a mat-list-item routerLink="/employees" (click)="closeSidenavOnMobile()">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Employees</span>
        </a>
  
        <a mat-list-item routerLink="/departments" (click)="closeSidenavOnMobile()">
          <mat-icon matListItemIcon>business</mat-icon>
          <span matListItemTitle>Departments</span>
        </a>
  
        <a mat-list-item routerLink="/attendance" (click)="closeSidenavOnMobile()">
          <mat-icon matListItemIcon>event_available</mat-icon>
          <span matListItemTitle>Attendance</span>
        </a>
  
        <a mat-list-item routerLink="/leaves" (click)="closeSidenavOnMobile()">
          <mat-icon matListItemIcon>event_busy</mat-icon>
          <span matListItemTitle>Leaves</span>
        </a>
  
      </mat-nav-list>
  
    </mat-sidenav>
  
  
    <!-- Main Content -->
    <mat-sidenav-content>
  
      <!-- Header -->
      <mat-toolbar class="app-toolbar">
  
        <!-- Mobile menu button -->
        <button
          mat-icon-button
          *ngIf="isMobile"
          (click)="sidenav.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
  
        <span class="page-title" title="Employee Management System" (click)="openCloseSidenav()">EMS</span>
  
        <span class="spacer"></span>
  
        <!-- Theme -->
        <button
        mat-icon-button
        (click)="toggleTheme()"
        [matTooltip]="themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode'"
      >
        <mat-icon>
          {{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}
        </mat-icon>
      </button>
        <!-- Notifications -->
        <button mat-icon-button>
          <mat-icon>notifications</mat-icon>
        </button>
  
        <!-- Profile -->
        <button mat-icon-button>
          <mat-icon>account_circle</mat-icon>
        </button>
  
      </mat-toolbar>
  
  
      <!-- Page -->
      <main class="page-content">
        <router-outlet></router-outlet>
      </main>
  
    </mat-sidenav-content>
  
  </mat-sidenav-container>
